[package]
name = "pvrway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[features]
proxy = ["dep:wayland-server", "dep:wayland-protocols"]

[dependencies]
log = "0.4"
wayland-server = { version = "0.31", optional = true }
wayland-protocols = { version = "0.31.2", features = ["server", "unstable"], optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
android_logger = "0.15"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
ndk = "0.9"
glow = "0.16"

[package.metadata.android]
package = "io.eatgrapes.pvrway"
apk_name = "PvrWay"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "PvrWay"
theme = "@android:style/Theme.Material.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize"
orientation = "landscape"

[package.metadata.android.signing.release]
path = "C:/Users/Administrator/.android/debug.keystore"
keystore_password = "android"
